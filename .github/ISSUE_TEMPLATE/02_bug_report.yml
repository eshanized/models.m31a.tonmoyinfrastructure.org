name: "🐛 Bug Report"
description: "Report a bug, regression, or inaccurate observability status in the dashboard or API."
title: "[Bug]: "
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please describe the problem and reproduction steps below.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Web Dashboard / Frontend UI"
        - "Public API (/api/v1/models, /api/v1/status, /api/v1/catalog)"
        - "Synthetic Probe Worker (scripts/probe_worker.ts)"
        - "Canonical Registry / Schema Validation"
        - "M31A Agent Sync Contract (/data/m31a-models.json)"
        - "CI / Automated GitHub Action Workflow"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When querying the status API for model..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps or `curl` command to reproduce the behavior.
      placeholder: |
        1. Query `curl -s https://models.m31a.tonmoyinfrastructure.org/api/v1/status`
        2. Inspect output for ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Stack
      description: Paste any terminal output, browser console errors, or HTTP payloads.
      render: shell
