name: Daily NVIDIA Catalog Sync

on:
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Canonical Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Registry Synchronization
        run: npm run registry:sync
        env:
          REGISTRY_ALLOW_STALE_CACHE: 'false'
          REGISTRY_MIN_DISCOVERED_MODELS: '50'

      - name: Validate Canonical Schema
        run: npm run registry:validate

      - name: Export JSON Distribution Artifacts
        run: npm run registry:export

      - name: Commit & Push Changes
        run: |
          git config user.name "m31a-catalog-bot"
          git config user.email "bot@m31a.tonmoyinfrastructure.org"
          if [ -n "$(git status --porcelain registry/ src/data/ public/data/)" ]; then
            git add registry/ src/data/ public/data/
            git commit -m "chore(registry): sync canonical NVIDIA Build catalog [skip ci]"
            git push origin master
          else
            echo "No catalog changes detected."
          fi
