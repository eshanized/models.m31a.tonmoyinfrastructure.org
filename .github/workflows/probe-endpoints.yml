name: Scheduled Synthetic Endpoint Monitoring

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-registry-and-observability-publication
  cancel-in-progress: false

jobs:
  probe:
    name: Probe, validate, and publish endpoint observations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog before probing
        run: npm run registry:validate

      - name: Execute controlled synthetic monitoring cycle
        run: npm run probe:run
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: 'https://integrate.api.nvidia.com/v1'
          PROBE_PER_CYCLE_LIMIT: '8'
          PROBE_CONCURRENCY: '2'
          PROBE_TIMEOUT_MS: '15000'
          PROBE_MAX_RETRIES: '2'
          PROBE_KILL_SWITCH: ${{ vars.PROBE_KILL_SWITCH || 'false' }}

      - name: Merge and validate public observability snapshot
        run: npm run probe:publish

      - name: Commit and publish observation history
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "m31a-observability-bot"
          git config user.email "bot@m31a.tonmoyinfrastructure.org"
          git add public/data/observability.json src/data/observability.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No observation data was produced or no data changed."
            exit 0
          fi
          git commit -m "chore(observability): publish synthetic endpoint observations"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish monitoring snapshot after three attempts." >&2
              exit 1
            fi
            sleep "$attempt"
          done

  deploy:
    name: Deploy refreshed observability snapshot to GitHub Pages
    needs: probe
    if: needs.probe.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
