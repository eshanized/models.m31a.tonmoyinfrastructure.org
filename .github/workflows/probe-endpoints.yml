name: Scheduled Synthetic Endpoint Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Canary Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Controlled Synthetic Monitoring Cycle
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: 'https://integrate.api.nvidia.com/v1'
          INGESTION_URL: 'https://models.m31a.tonmoyinfrastructure.org/api/v1/ingest'
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          PROBE_PER_CYCLE_LIMIT: '8'
          PROBE_CONCURRENCY: '2'
          PROBE_TIMEOUT_MS: '10000'
          PROBE_MAX_RETRIES: '2'
          PROBE_KILL_SWITCH: ${{ vars.PROBE_KILL_SWITCH || 'false' }}
        run: npm run probe:run
