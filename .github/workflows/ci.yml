name: CI Verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Schema & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Canonical TOML Schema
        run: npm run registry:validate

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Strict TypeScript Check
        run: npm run typecheck

      - name: Verify Production Next.js Build
        run: npm run build
