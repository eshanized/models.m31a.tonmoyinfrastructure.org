name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Export generated catalog contracts
        run: npm run registry:export

      - name: Validate registry schema integrity
        run: npm run registry:validate

      - name: Run verification test suite
        run: npm run test

      - name: Build static export
        run: npm run build

      - name: Verify Pages artifacts
        run: |
          touch ./out/.nojekyll
          echo "models.m31a.tonmoyinfrastructure.org" > ./out/CNAME
          ls -la ./out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
